name: RISE — normalização única do centro de cliente
on:
  push:
    branches: [rise/client-center-phase1]
    paths: [".github/workflows/rise-client-format-once.yml"]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rise/client-center-phase1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.15.9"
      - name: Fixar imports e formatar
        run: |
          ruff check --fix django_rise_agency/client_center.py django_rise_agency/tests_client_center.py django_rise_agency/migrations/0002_riseeditorialassignment.py
          ruff format django_rise_agency/client_center.py django_rise_agency/tests_client_center.py django_rise_agency/migrations/0002_riseeditorialassignment.py
      - name: Guardar alterações de formatação
        run: |
          if ! git diff --quiet -- django_rise_agency/client_center.py django_rise_agency/tests_client_center.py django_rise_agency/migrations/0002_riseeditorialassignment.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add django_rise_agency/client_center.py django_rise_agency/tests_client_center.py django_rise_agency/migrations/0002_riseeditorialassignment.py
            git commit -m "style(rise): normalize client center"
            git push origin HEAD:rise/client-center-phase1
          fi
