name: RISE — normalização final de ficheiros integrados
on:
  push:
    branches:
      - rise/content-hub-v2
    paths:
      - ".github/workflows/rise-format-final.yml"

permissions:
  contents: write

jobs:
  format-final:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/rise/content-hub-v2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rise/content-hub-v2
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.15.9"
      - name: Formatar apenas os cinco ficheiros identificados pela CI
        run: |
          ruff format apps/approvals/services.py apps/calendar/views.py apps/composer/services.py apps/inbox/tests/test_sync.py apps/publisher/engine.py
          ruff check .
          ruff format --check .
          git diff --check
      - name: Guardar formatação no branch RISE
        run: |
          git config user.name "rise-ci[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add apps/approvals/services.py apps/calendar/views.py apps/composer/services.py apps/inbox/tests/test_sync.py apps/publisher/engine.py
            git commit -m "style(rise): completar formatação dos hooks e testes"
            git push origin HEAD:rise/content-hub-v2
          fi
