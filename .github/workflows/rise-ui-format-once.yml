name: RISE UI — normalização pontual
on:
  push:
    branches: [rise/agency-dashboard-v1]
    paths:
      - ".github/workflows/rise-ui-format-once.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rise/agency-dashboard-v1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.15.9"
      - run: ruff format django_rise_agency/dashboard.py django_rise_agency/tests_dashboard.py
      - name: Guardar apenas a formatação
        run: |
          if ! git diff --quiet -- django_rise_agency/dashboard.py django_rise_agency/tests_dashboard.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add django_rise_agency/dashboard.py django_rise_agency/tests_dashboard.py
            git commit -m "style(rise): format agency dashboard and access tests"
            git push origin HEAD:rise/agency-dashboard-v1
          fi
